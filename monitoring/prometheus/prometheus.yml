global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # SQL Server (operational DB)
  - job_name: mssql
    static_configs:
      - targets: ["mssql-exporter:4000"]
        labels: { database_role: source }

  # Postgres (staging / clean layer)
  - job_name: postgres-staging
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { database_role: staging }

  # ClickHouse built-in Prometheus endpoint (monitoring/clickhouse/prometheus.xml)
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
        labels: { database_role: warehouse }

  # ETL metrics pushed by scripts/ (rows, duration, last success, rejects, reconciliation)
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
